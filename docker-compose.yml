services:
  belote:
    build:
      context: .
      dockerfile: Dockerfile
    image: belote-contree:preprod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/sessions.sqlite
      STATIC_ROOT: /app/apps/web/dist
      E2E_FIXTURE: "0"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - belote-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  belote-data:
